name: CI

on:
  push:
    branches:
      - master
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/helltar/varta

concurrency:
  # only a pull request may drop an older run: on master every commit gets its own group, so a burst
  # of pushes neither cancels the run in progress nor discards the ones waiting behind it. the event
  # is part of the group so a release never queues behind the push of its own commit, where one more
  # run for that commit would drop it and the image would never be published.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose:
    name: Check Compose file
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the quick start downloads these two files from master, so they have to resolve together once
      # DOCKER_GID is filled in
      - name: Check Compose file
        run: cp .env.example .env && DOCKER_GID=0 docker compose config --quiet

  # every architecture the image is published for is built and run against a live daemon on a native
  # runner of its own: an image that was only cross-built is one nobody has seen start.
  test:
    name: Test and build
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Test and build JAR
        run: |
          set -o pipefail

          for attempt in 1 2 3; do
            if ./gradlew check shadowJar 2>&1 | tee gradle-build.log; then
              exit 0
            fi

            if ! grep -Eq '429.*Too Many Requests' gradle-build.log || [[ "$attempt" == 3 ]]; then
              exit 1
            fi

            sleep $((attempt * 10))
          done

      - name: Build Docker image
        run: |
          set -o pipefail

          for attempt in 1 2 3; do
            if docker build --tag varta:ci . 2>&1 | tee docker-build.log; then
              exit 0
            fi

            if ! grep -Eq '429.*Too Many Requests' docker-build.log || [[ "$attempt" == 3 ]]; then
              exit 1
            fi

            sleep $((attempt * 10))
          done

      - name: Start healthy fixture
        run: |
          docker run --detach --name varta-ci-fixture \
            --label com.docker.compose.project=varta-ci \
            --label com.docker.compose.service=fixture \
            --health-cmd 'exit 0' \
            --health-interval=1s \
            --health-start-period=10s \
            --health-start-interval=1s \
            --entrypoint sleep \
            varta:ci 5m

      - name: Start Docker image
        id: container
        run: |
          docker run --detach --name varta-ci \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            --label com.docker.compose.project=varta-ci \
            --label com.docker.compose.service=varta \
            --env BOT_TOKEN=000:invalid \
            --env CHAT_ID=1 \
            --env PROJECTS=varta-ci \
            --env POLL_INTERVAL_SECONDS=1 \
            --env SETTLE_TIMEOUT_SECONDS=10 \
            --health-interval=1s \
            --health-start-period=10s \
            --health-start-interval=1s \
            --health-retries=10 \
            varta:ci

      - name: Verify Docker health and Varta report
        run: |
          for attempt in {1..30}; do
            varta_health="$(docker inspect --format '{{.State.Health.Status}}' varta-ci)"
            varta_state="$(docker inspect --format '{{.State.Status}}' varta-ci)"
            fixture_health="$(docker inspect --format '{{.State.Health.Status}}' varta-ci-fixture)"
            fixture_state="$(docker inspect --format '{{.State.Status}}' varta-ci-fixture)"
            logs="$(docker logs varta-ci 2>&1)"

            if [[ "$varta_health" == healthy && "$fixture_health" == healthy ]] && \
                grep -Fq 'All 2 healthy' <<< "$logs"; then
              exit 0
            fi

            if [[ "$varta_health" == unhealthy || "$varta_state" == exited || \
                  "$fixture_health" == unhealthy || "$fixture_state" == exited ]] || \
                grep -Fq 'unverified' <<< "$logs"; then
              exit 1
            fi

            sleep 1
          done

          exit 1

      - name: Show container logs
        if: failure() && steps.container.outcome == 'success'
        run: docker logs varta-ci

      - name: Remove containers
        if: always()
        run: docker rm --force varta-ci varta-ci-fixture || true

  # a release ships only after the tests above pass on its own commit. each architecture is built on
  # a native runner of its own and pushed by digest alone; `publish` then puts the tags on the two
  # together. the builds are not retried like the ones above: if maven central answers 429, re-run
  # the failed jobs.
  build:
    # github appends the arch to the name of a matrix job once it runs. spelled out here, it would stay
    # unexpanded on every push, where this job is skipped
    name: Build image
    if: github.event_name == 'release'
    needs:
      - compose
      - test
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Record digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # a prerelease gets its version and nothing that moves. the action's own `latest=auto` would
          # tag it latest anyway, so it is off and the raw line below is the only source of latest.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event.release.prerelease == false }}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}

      - name: Tag the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        env:
          METADATA: ${{ steps.metadata.outputs.json }}
        run: |
          tags=()
          while read -r tag; do
            tags+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA")

          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Read image digest
        id: index
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" == sha256:* ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # the image gets read access to the host's docker socket, so whoever runs it can check where it
      # was built: gh attestation verify oci://ghcr.io/helltar/varta:<version> -R Helltar/varta
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
